<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - Users Directory</title>
    <script src="users.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
        }

        input {
            flex: 1;
            min-width: 200px;
        }

        button {
            background-color: #176b50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        #users-list {
            list-style: none;
            padding: 0;
        }

        .user-card {
            background-color: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px #00000015;
        }

        .user-card h2 {
            margin-top: 0;
        }

        #status {
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Users Directory</h1>
        <p>Load users from an API and search by name.</p>
    </header>

    <main>
        <div class="controls">
            <button id="load-users" type="button">Load Users</button>

            <label for="filter-input">Filter users:</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Enter a user's name"
            >
        </div>

        <p id="status" role="status" aria-live="polite">Click "Load Users" to begin.</p>

        <ul id="users-list"></ul>
    </main>
</body>
</html>
